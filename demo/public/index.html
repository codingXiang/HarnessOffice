<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HarnessOffice · Mock mode</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">Mock mode</p>
        <h1>HarnessOffice</h1>
      </div>
      <p class="banner">這是展示。不會呼叫 Hermes、OpenCode，也不會寫入 GitHub。Office 畫面是同一台機器上的 PixelOffice 視窗。</p>
    </header>
    <main>
      <section class="chat" aria-label="Group Chat">
        <div class="section-title">
          <h2>群組對話</h2>
          <p>Shared chat。一個 Project 只有這一間，用 @Role 找人。Hire 與狀態會送到 PixelOffice。</p>
        </div>
        <p id="office-link" class="note">Office：在跑 demo 的那台機器打開 PixelOffice（事件 UDP 127.0.0.1:9997、HTTP 127.0.0.1:3003）。</p>
        <ol id="log" class="log"></ol>
        <div id="issue" class="issue" hidden></div>
        <div id="candidates" class="candidates"></div>
        <div id="pr" class="pr" hidden></div>
        <form id="composer">
          <label for="draft">對 Group Chat 說話</label>
          <textarea id="draft" rows="2" placeholder="@HR PM"></textarea>
          <div class="actions">
            <button type="submit">送出</button>
            <button type="button" id="approve" disabled>核准 Issue</button>
            <button type="button" id="hold" disabled>先不要</button>
            <button type="button" id="animate" disabled>播放寫程式動畫</button>
          </div>
        </form>
      </section>
    </main>
    <footer id="iac">正在確認 IaC store…</footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
